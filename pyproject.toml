[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "github-rank"
version = "0.1.0"
description = "GitHub project discovery and AI frontier news"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
github-rank = "github_rank.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
